name: Build Python Applications

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'buildv2.txt'

      - name: Install dependencies
        run: pip install -r buildv2.txt

      - name: Cache ccache (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('buildv2.txt') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Install ccache (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y ccache
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install ccache
          fi
        shell: bash

      - name: Install Clang on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tools

      - name: Build Applications
        run: python build.py

      - name: List build contents
        run: |
          ls -la build || dir build
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            build/*.zip
            build/*.bin
