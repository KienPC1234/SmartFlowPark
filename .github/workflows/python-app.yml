name: Build Python Applications with Nuitka

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: buildv2.txt

      - name: Install base dependencies
        run: |
          pip install -r buildv2.txt

      - name: Install MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y


      - name: Build Client Application
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: Client/main.py
          mode: standalone
          enable-plugins: |
            pyside6
          assume-yes-for-downloads: true
          disable-console: ${{ runner.os == 'Windows' }}
          output-dir: build/Client App
          python-flag: ${{ runner.os == 'Windows' && '--mingw' || '' }}

      - name: Build Monitoring Unit Application (Basic - macOS)
        if: matrix.os == 'macos-latest'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: Monitoring Unit/main.py
          mode: standalone
          assume-yes-for-downloads: true
          output-dir: build/Monitoring Unit App

      - name: Install PyTorch with CUDA 12.4
        if: matrix.os != 'macos-latest'
        run: |
          pip uninstall -y torch torchvision torchaudio
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124

      - name: Build Monitoring Unit Application (CUDA 12.4)
        if: matrix.os != 'macos-latest'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: Monitoring Unit/main.py
          mode: standalone
          assume-yes-for-downloads: true
          disable-console: ${{ runner.os == 'Windows' }}
          output-dir: build/Monitoring Unit App cu124
          python-flag: ${{ runner.os == 'Windows' && '--mingw' || '' }}

      - name: Install PyTorch with CUDA 12.6
        if: matrix.os != 'macos-latest'
        run: |
          pip uninstall -y torch torchvision torchaudio
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126

      - name: Build Monitoring Unit Application (CUDA 12.6)
        if: matrix.os != 'macos-latest'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: Monitoring Unit/main.py
          mode: standalone
          assume-yes-for-downloads: true
          disable-console: ${{ runner.os == 'Windows' }}
          output-dir: build/Monitoring Unit App cu126
          python-flag: ${{ runner.os == 'Windows' && '--mingw' || '' }}

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-Client-App
          path: |
            build/Client App/**
          include-hidden-files: true

      - name: Upload Monitoring Unit Artifact (Basic - macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-Monitoring-Unit-App
          path: |
            build/Monitoring Unit App/**
          include-hidden-files: true

      - name: Upload Monitoring Unit Artifact (CUDA 12.4)
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-Monitoring-Unit-App-cu124
          path: |
            build/Monitoring Unit App cu124/**
          include-hidden-files: true

      - name: Upload Monitoring Unit Artifact (CUDA 12.6)
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-Monitoring-Unit-App-cu126
          path: |
            build/Monitoring Unit App cu126/**
          include-hidden-files: true
