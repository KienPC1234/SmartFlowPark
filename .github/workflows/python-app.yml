name: Build Python Applications with Nuitka

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Check-out repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python 3.12
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: buildv2.txt

      # Install base dependencies from buildv2.txt
      - name: Install base dependencies
        run: |
          pip install -r buildv2.txt

      # Build Client Application (không thay đổi)
      - name: Build Client Application
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: Client/main.py
          mode: standalone
          enable-plugins: |
            pyside6
            multiprocessing
            pkg-resources
          assume-yes-for-downloads: true
          disable-console: ${{ runner.os == 'Windows' }}
          output-dir: build/Client App

      # Install PyTorch with CUDA 12.4 for Monitoring Unit (cu124)
      - name: Install PyTorch with CUDA 12.4
        run: |
          pip uninstall -y torch torchvision torchaudio  # Xóa phiên bản cũ nếu có
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124

      # Build Monitoring Unit Application with CUDA 12.4
      - name: Build Monitoring Unit Application (CUDA 12.4)
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: Monitoring Unit/main.py
          mode: standalone
          enable-plugins: |
            pyside6
            multiprocessing
            pkg-resources
          assume-yes-for-downloads: true
          disable-console: ${{ runner.os == 'Windows' }}
          output-dir: build/Monitoring Unit App cu124

      # Install PyTorch with CUDA 12.6 for Monitoring Unit (cu126)
      - name: Install PyTorch with CUDA 12.6
        run: |
          pip uninstall -y torch torchvision torchaudio  # Xóa phiên bản cu124
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126

      # Build Monitoring Unit Application with CUDA 12.6
      - name: Build Monitoring Unit Application (CUDA 12.6)
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: Monitoring Unit/main.py
          mode: standalone
          enable-plugins: |
            pyside6
            multiprocessing
            pkg-resources
          assume-yes-for-downloads: true
          disable-console: ${{ runner.os == 'Windows' }}
          output-dir: build/Monitoring Unit App cu126

      # Upload Client Artifact
      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-Client-App
          path: |
            build/Client App/**
          include-hidden-files: true

      # Upload Monitoring Unit Artifact (CUDA 12.4)
      - name: Upload Monitoring Unit Artifact (CUDA 12.4)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-Monitoring-Unit-App-cu124
          path: |
            build/Monitoring Unit App cu124/**
          include-hidden-files: true

      # Upload Monitoring Unit Artifact (CUDA 12.6)
      - name: Upload Monitoring Unit Artifact (CUDA 12.6)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-Monitoring-Unit-App-cu126
          path: |
            build/Monitoring Unit App cu126/**
          include-hidden-files: true