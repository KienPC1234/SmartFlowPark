name: Build Python Applications with Nuitka

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Check-out repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python 3.12
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: build.txt

      # Install dependencies from build.txt
      - name: Install dependencies
        run: |
          pip install -r build.txt

      # Build Client App
      - name: Build Client Application
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: Client/main.py
          mode: standalone
          enable-plugins: |
            pyside6
            multiprocessing
            pkg-resources
          additional-args: |
            --assume-yes-for-downloads
            --windows-console-mode=disable
            --remove-output
            --output-dir=build/Client App

      # Build Monitoring Unit App
      - name: Build Monitoring Unit Application
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: Monitoring Unit/main.py
          mode: standalone
          enable-plugins: |
            pyside6
            multiprocessing
            pkg-resources
          additional-args: |
            --assume-yes-for-downloads
            --windows-console-mode=disable
            --remove-output
            --output-dir=build/Monitoring Unit App

      # Upload Client Artifact (lấy toàn bộ thư mục)
      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-Client-App
          path: |
            build/Client App/**  # Lấy tất cả file và thư mục con
          include-hidden-files: true

      # Upload Monitoring Unit Artifact (lấy toàn bộ thư mục)
      - name: Upload Monitoring Unit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-Monitoring-Unit-App
          path: |
            build/Monitoring Unit App/**  # Lấy tất cả file và thư mục con
          include-hidden-files: true